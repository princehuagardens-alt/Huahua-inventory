<title>花花公子 庫存銷售</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --g:#1f5c46; --g2:#2e7d5f; --gl:#e7f3ee; --bg:#f4f5f3; --card:#fff; --ink:#1d2421; --mut:#6b7570;
  --line:#e3e6e3; --red:#c0392b; --redl:#fbeaea; --amb:#b7791f; --ambl:#fdf3e1; --blue:#2b6cb0; --bluel:#e8f0fa;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* layout */
#app{min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
.top{position:sticky;top:0;z-index:20;background:rgba(244,245,243,.94);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px}
.top h1{font-size:22px;margin:0;flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 28px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:var(--safe-b)}
.tabbar-in{display:flex;width:100%;max-width:760px}
.tab{flex:1;border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#8a938f;font-size:13px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--g);font-weight:600}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--g);color:#fff;font-weight:600;min-height:46px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sec{background:#e9ecea;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--g);padding:8px 10px;min-height:40px}
.btn.danger{background:var(--redl);color:var(--red)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* cards & lists */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:19px;margin:0;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

const recipeOf = pid => D.recipe_items.filter(r => r.product_id === pid);
const bundleOf = pid => D.bundle_items.filter(r => r.bundle_id === pid);

function recipeCost(p) {
  const y = +p.recipe_yield || 1;
  return recipeOf(p.id).reduce((s, r) => s + r.qty * (+(mat(r.material_id)?.avg_cost) || 0), 0) / y;
}
function unitCost(p, depth = 0) {
  if (!p || depth > 5) return 0;
  if (p.kind === 'bundle') return bundleOf(p.id).reduce((s, b) => s + b.qty * unitCost(prod(b.product_id), depth + 1), 0);
  if (p.kind === 'made' && +p.avg_cost > 0) return +p.avg_cost;
  return recipeCost(p);
}
function available(p, depth = 0) {
  if (!p || depth > 5) return 0;
  if (p.kind === 'made') return pQty(p.id);
  if (p.kind === 'bundle') {
    const its = bundleOf(p.id); if (!its.length) return 0;
    return Math.max(0, Math.min(...its.map(b => Math.floor(available(prod(b.product_id), depth + 1) / b.qty))));
  }
  const its = recipeOf(p.id); if (!its.length) return null;
  const y = +p.recipe_yield || 1;
  return Math.max(0, Math.min(...its.map(r => Math.floor(mQty(r.material_id) / (r.qty / y)))));
}

async function signPhotos(paths) {
  const need = [...new Set(paths.filter(p => p && !URLS.has(p)))];
  for (let i = 0; i < need.length; i += 100) {
    const data = await q(sb.storage.from('photos').createSignedUrls(need.slice(i, i + 100), 60 * 60 * 24 * 7));
    data.forEach(d => { if (d.signedUrl) URLS.set(d.path, d.signedUrl); });
  }
}
function photo(paths, cls = '') {
  const p = (paths || [])[0]; const u = p && URLS.get(p);
  return u ? `<img class="ph ${cls}" src="${esc(u)}" alt="" loading="lazy">` : `<div class="ph ${cls}">${I.leaf}</div>`;
}
function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('無法讀取這張照片')); img.src = URL.createObjectURL(file); });
}
async function compress(file, max = 1280) {
  const img = await loadImage(file);
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}
async function uploadPhoto(file) {
  const blob = await compress(file);
  const path = `${USER.id}/${crypto.randomUUID()}.jpg`;
  await q(sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' }));
  await signPhotos([path]);
  return path;
}
// 照片編輯元件：回傳 { html, mount(root), get() }
function photoEditor(initial) {
  const st = { list: [...(initial || [])], busy: 0 };
  const id = 'pe' + Math.random().toString(36).slice(2, 8);
  const draw = () => {
    const el = document.getElementById(id); if (!el) return;
    el.innerHTML = st.list.map((p, i) => `<div class="p"><img src="${esc(URLS.get(p) || '')}" alt="">${i === 0 ? '<span class="cov">封面</span>' : `<button type="button" class="cov" style="border:0" data-i="${i}" data-cover>設為封面</button>`}<button type="button" class="rm" data-i="${i}" data-rm>×</button></div>`).join('')
      + (st.busy ? `<div class="add"><span class="spin" style="border-color:#ccc;border-top-color:var(--g)"></span>上傳中</div>` : '')
      + `<label class="add">${I.cam}<span>拍照／相簿</span><input type="file" accept="image/*" multiple class="hidden"></label>`;
    $('input[type=file]', el).onchange = async ev => {
      const files = [...ev.target.files]; ev.target.value = '';
      st.busy += files.length; draw();
      for (const f of files) {
        try { st.list.push(await uploadPhoto(f)); } catch (e) { toast('照片上傳失敗：' + errMsg(e), true); }
        st.busy--; draw();
      }
    };
    $$('[data-rm]', el).forEach(b => b.onclick = () => { st.list.splice(+b.dataset.i, 1); draw(); });
    $$('[data-cover]', el).forEach(b => b.onclick = () => { const [x] = st.list.splice(+b.dataset.i, 1); st.list.unshift(x); draw(); });
  };
  return { html: `<div class="phs" id="${id}"></div>`, mount: draw, get: () => { if (st.busy) throw new Error('照片還在上傳，請稍等'); return st.list; } };
}

const MODALS = [];
function openModal({ title, body, foot = '', wide = false, okText, onOk, onMount, cancelText = '取消' }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}"><div class="sh-head"><button class="btn ghost" data-x>${cancelText}</button><h3>${esc(title)}</h3>${okText ? `<button class="btn sm" data-ok>${esc(okText)}</button>` : '<span style="min-width:72px"></span>'}</div><div class="sh-body">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}</div>`;
  $('#modals').appendChild(ov);
  const m = { el: ov, close: () => { ov.remove(); MODALS.splice(MODALS.indexOf(m), 1); document.body.style.overflow = MODALS.length ? 'hidden' : ''; } };
  MODALS.push(m); document.body.style.overflow = 'hidden';
  $('[data-x]', ov).onclick = m.close;
  ov.addEventListener('click', e => { if (e.target === ov) m.close(); });
  if (onOk) $('[data-ok]', ov).onclick = e => guard(() => onOk(m), e.currentTarget);
  onMount && onMount(m, ov);
  return m;
}
function confirmBox(msg, okText = '確定') {

    $('[data-no]', m.el).onclick = () => { m.close(); res(false); };
    $('[data-yes]', m.el).onclick = () => { m.close(); res(true); };
    $('[data-x]', m.el).onclick = () => { m.close(); res(false); };
  });
}

function pickDate(cur, done) {
  let y = +cur.slice(0, 4), m = +cur.slice(5, 7) - 1;
  openModal({ title: '選擇日期', body: '<div id="cal"></div>', onMount: (mm, el) => {
    const draw = () => {
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), t = today();
      let cells = '';
      for (let i = 0; i < first; i++) cells += '<span></span>';
      for (let d = 1; d <= days; d++) { const iso = `${y}-${pad2(m + 1)}-${pad2(d)}`; cells += `<button type="button" data-d="${iso}" class="${iso === cur ? 'sel' : ''} ${iso === t ? 'tod' : ''}">${d}</button>`; }
      $('#cal', el).innerHTML = `<div class="cal-h"><button type="button" data-n="-1">‹</button><b>${y} 年 ${m + 1} 月</b><button type="button" data-n="1">›</button></div>
        <div class="cal-w">${[...'日一二三四五六'].map(w => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells}</div>
        <div class="btn-row" style="margin-top:16px"><button type="button" class="btn sec" data-q="-2">前天</button><button type="button" class="btn sec" data-q="-1">昨天</button><button type="button" class="btn" data-q="0">今天</button></div>`;
      $$('[data-n]', el).forEach(b => b.onclick = () => { m += +b.dataset.n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } draw(); });
      $$('[data-d]', el).forEach(b => b.onclick = () => { mm.close(); done(b.dataset.d); });
      $$('[data-q]', el).forEach(b => b.onclick = () => { mm.close(); done(addDays(today(), +b.dataset.q)); });
    };
    draw();
  } });
}

function viewMaterials() {
  const s = UI.mSearch.trim().toLowerCase();
  let list = D.materials.filter(m => (UI.showArchived || !m.archived) && (!UI.mCat || m.category_id === UI.mCat)
    && (!s || [m.name, m.code, sup(m.supplier_id)?.name].some(x => String(x || '').toLowerCase().includes(s))));
  const items = list.map(m => {
    const qn = mQty(m.id), low = m.min_stock != null && qn < +m.min_stock;
    if (UI.mView === 'grid') return `<button class="tile" data-act="matDetail" data-id="${m.id}">${photo(m.photos)}<div class="tx"><div class="name" style="font-weight:650">${esc(m.name)}</div><div class="${low ? 'neg' : 'mut'}" style="font-size:14px">庫存 ${qf(qn)} ${esc(m.unit)}</div></div></button>`;
    return `<button class="item" data-act="matDetail" data-id="${m.id}">${photo(m.photos)}<div class="meta"><div class="name">${esc(m.name)}${m.archived ? '<span class="badge">停用</span>' : ''}</div>
      <div class="sub">${esc(cat(m.category_id)?.name || '未分類')}・${esc(sup(m.supplier_id)?.name || '未設定供應商')}</div><div class="sub">平均成本 ${money(m.avg_cost)} / ${esc(m.unit)}</div></div>
      <div class="right"><div class="big ${low ? 'neg' : ''}">${qf(qn)}</div><div class="mut" style="font-size:13px">${esc(m.unit)}${low ? '・不足' : ''}</div></div></button>`;
  }).join('');
  const html = `<div class="toolbar"><input class="search" id="ms" placeholder="搜尋原料名稱、編號、供應商" value="${esc(UI.mSearch)}">
      <div class="seg"><button class="${UI.mView === 'list' ? 'on' : ''}" data-act="mView" data-v="list">清單</button><button class="${UI.mView === 'grid' ? 'on' : ''}" data-act="mView" data-v="grid">圖片牆</button></div></div>
    <div class="chips"><button class="chip ${!UI.mCat ? 'on' : ''}" data-act="mCat" data-v="">全部</button>${cats('material').map(c => `<button class="chip ${UI.mCat === c.id ? 'on' : ''}" data-act="mCat" data-v="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    ${list.length ? `<div class="grid ${UI.mView === 'grid' ? 'tiles' : ''}" id="mlist">${items}</div>` : `<div class="empty">${D.materials.length ? '找不到符合的原料' : '還沒有原料，按右上角「＋新增原料」開始建立'}</div>`}`;
  setTimeout(() => { const el = $('#ms'); if (el) el.oninput = () => { UI.mSearch = el.value; const pos = el.selectionStart; render(); const n = $('#ms'); n.focus(); n.setSelectionRange(pos, pos); }; });
  return { title: '原料', action: `<button class="btn sm" data-act="newMaterial">${I.plus}新增原料</button>`, html };
}

async function loadHistory(filter, el) {
  try {
    let qq = sb.from('stock_movements').select('*');
    Object.entries(filter).forEach(([k, val]) => qq = qq.eq(k, val));
    const rows = await q(qq.order('created_at', { ascending: false }).limit(100));
    el.innerHTML = rows.length ? rows.map(moveRow).join('') : '<div class="mut">還沒有紀錄</div>';
  } catch (e) { el.innerHTML = `<div class="neg">${esc(errMsg(e))}</div>`; }
}

// ====================== 庫存調整：入庫、出庫、報損、盤點 ======================
function adjustForm({ material, product, mode, onDone }) {
  const it = material || product, isP = !!product, cur = isP ? pQty(it.id) : mQty(it.id);
  const titles = { in: '手動入庫', out: '手動出庫', loss: '報損', count: '盤點' };
  const batches = isP && it.track_batch ? D.batches.filter(b => b.product_id === it.id && +b.qty_left > 0).sort((a, b) => a.made_on.localeCompare(b.made_on)) : [];
  const body = `
    <div class="item" style="margin-bottom:14px">${photo(it.photos)}<div class="meta"><div class="name">${esc(it.name)}</div><div class="sub">目前庫存 ${qf(cur)} ${esc(it.unit)}</div></div></div>
    ${mode === 'count' ? `<div class="f"><label>實際數到的數量（${esc(it.unit)}）</label><input class="in" id="a-q" inputmode="decimal" value="${qf(cur).replace(/,/g, '')}" style="font-size:24px;font-weight:700;text-align:center"></div><p class="hint" id="a-diff"></p>`
      : `<div class="f"><label>數量（${esc(it.unit)}）</label><input class="in" id="a-q" inputmode="decimal" placeholder="0" style="font-size:24px;font-weight:700;text-align:center"></div>`}
    ${mode === 'in' ? `<div class="f"><label>每單位成本（選填）</label><input class="in" id="a-c" inputmode="decimal" placeholder="不填就用目前平均成本 ${money(it.avg_cost)}"></div><p class="hint">手動入庫不會記成支出。如果是買來的，請改用「進貨」。</p>` : ''}
    ${mode === 'loss' ? `<div class="f"><label>原因</label><div class="chips" id="a-r">${LOSS_REASONS.map((r, i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div></div>` : ''}
    ${(mode === 'loss' || mode === 'out') && batches.length ? `<div class="f"><label>哪一批</label><select class="in" id="a-b"><option value="">自動（先扣最早做的）</option>${batches.map(b => `<option value="${b.id}">${dm(b.made_on)} 製作・剩 ${qf(b.qty_left)}${b.expires_on ? '・' + dm(b.expires_on) + ' 到期' : ''}</option>`).join('')}</select></div>` : ''}
    <div class="fr"><div class="f"><label>日期</label>${dateField('a-d', defDate())}</div>
    <div class="f"><label>備註</label><input class="in" id="a-n"></div></div>`;
  openModal({ title: titles[mode], body, okText: '確定',
    onMount: (md, el) => {
      bindDates(el);
      $$('#a-r .chip', el).forEach(c => c.onclick = () => { $$('#a-r .chip', el).forEach(x => x.classList.remove('on')); c.classList.add('on'); });
      if (mode === 'count') { const upd = () => { const d = num(v(el, '#a-q')) - cur; $('#a-diff', el).innerHTML = d === 0 ? '數量相同，不會調整' : `會調整 <b class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${qf(d)}</b> ${esc(it.unit)}`; }; $('#a-q', el).oninput = upd; upd(); }
    },
    onOk: async md => {
      const el = md.el, qn = num(v(el, '#a-q'));
      let change, reason, loss = null;
      if (mode === 'count') { change = r2(qn - cur); reason = 'count'; }
      else { if (qn <= 0) throw new Error('請輸入數量'); change = mode === 'in' ? qn : -qn; reason = { in: 'manual_in', out: 'manual_out', loss: 'loss' }[mode]; }
      if (mode === 'loss') loss = $('#a-r .chip.on', el)?.dataset.r || null;
      if (change !== 0) await q(sb.rpc('adjust_stock', { p_material: isP ? null : it.id, p_product: isP ? it.id : null, p_qty_change: change, p_reason: reason,
        p_loss_reason: loss, p_note: v(el, '#a-n').trim() || null, p_unit_cost: mode === 'in' ? numOrNull(v(el, '#a-c')) : null, p_batch: v(el, '#a-b') || null, p_date: v(el, '#a-d') || today() }));
      md.close(); await refresh(); toast('已記錄'); onDone && onDone();
    } });
}
function lossPick() {
  const list = [...D.products.filter(p => !p.archived && p.kind === 'made').map(p => ({ t: 'p', x: p })), ...D.materials.filter(m => !m.archived).map(m => ({ t: 'm', x: m }))];
  const m = openModal({ title: '報損：選擇品項', body: `<input class="search" id="lp-s" placeholder="搜尋" style="width:100%;margin-bottom:12px"><div id="lp-l"></div>` , onMount: (md, el) => {
    const draw = () => { const s = v(el, '#lp-s').toLowerCase(); $('#lp-l', el).innerHTML = list.filter(o => o.x.name.toLowerCase().includes(s)).map(o => `<button class="item" style="margin-bottom:8px" data-t="${o.t}" data-id="${o.x.id}">${photo(o.x.photos)}<div class="meta"><div class="name">${esc(o.x.name)}</div><div class="sub">${o.t === 'p' ? '成品' : '原料'}・庫存 ${qf(o.t === 'p' ? pQty(o.x.id) : mQty(o.x.id))} ${esc(o.x.unit)}</div></div></button>`).join('') || '<div class="empty">沒有品項</div>';
      $$('[data-t]', el).forEach(b => b.onclick = () => { md.close(); adjustForm(b.dataset.t === 'p' ? { product: prod(b.dataset.id), mode: 'loss' } : { material: mat(b.dataset.id), mode: 'loss' }); }); };
    $('#lp-s', el).oninput = draw; draw(); } });
}

// ====================== 盤點 ======================
function stocktake() {
  const st = { t: 'm', changes: {}, date: defDate() };
  openModal({ title: '盤點', wide: true, okText: '儲存盤點', body: `<div class="toolbar"><div class="seg" id="st-seg"><button data-t="m" class="on">原料</button><button data-t="p">成品</button></div><input class="search" id="st-s" placeholder="搜尋"></div><p class="hint" style="margin:-4px 2px 12px">盤點日期：${fmtDate(st.date)}。輸入實際數到的數量，有改動的會以黃框標示，最後按「儲存盤點」一次更新</p><div id="st-l"></div>`,
    onMount: (md, el) => {
      const draw = () => {
        const s = v(el, '#st-s').toLowerCase();
        const list = st.t === 'm' ? D.materials.filter(m => !m.archived) : D.products.filter(p => !p.archived && p.kind === 'made');
        $('#st-l', el).innerHTML = list.filter(x => x.name.toLowerCase().includes(s)).map(x => {
          const key = st.t + ':' + x.id, cur = st.t === 'm' ? mQty(x.id) : pQty(x.id), val = st.changes[key] ?? '';
          return `<div class="st-card ${val !== '' && num(val) !== r2(cur) ? 'chg' : ''}">${photo(x.photos)}<div class="meta"><div class="name" style="font-weight:650">${esc(x.name)}</div><div class="mut" style="font-size:14px">系統庫存 ${qf(cur)} ${esc(x.unit)}</div></div><input class="in" inputmode="decimal" data-k="${key}" placeholder="${qf(cur).replace(/,/g, '')}" value="${esc(val)}"></div>`;
        }).join('') || '<div class="empty">沒有品項</div>';
        $$('[data-k]', el).forEach(i => i.oninput = () => { st.changes[i.dataset.k] = i.value; const [t, id] = i.dataset.k.split(':'); const cur = t === 'm' ? mQty(id) : pQty(id); i.parentElement.classList.toggle('chg', i.value !== '' && num(i.value) !== r2(cur)); });
      };
      $$('#st-seg button', el).forEach(b => b.onclick = () => { st.t = b.dataset.t; $$('#st-seg button', el).forEach(x => x.classList.toggle('on', x === b)); draw(); });
      $('#st-s', el).oninput = draw; draw();
    },
    onOk: async md => {
      const todo = Object.entries(st.changes).filter(([, val]) => String(val).trim() !== '').map(([k, val]) => { const [t, id] = k.split(':'); const cur = t === 'm' ? mQty(id) : pQty(id); return { t, id, d: r2(num(val) - cur) }; }).filter(x => x.d !== 0);
      if (!todo.length) { md.close(); toast('沒有需要調整的項目'); return; }
      for (const x of todo) await q(sb.rpc('adjust_stock', { p_material: x.t === 'm' ? x.id : null, p_product: x.t === 'p' ? x.id : null, p_qty_change: x.d, p_reason: 'count', p_note: '盤點', p_date: st.date }));
      md.close(); await refresh(); toast(`已調整 ${todo.length} 項`);
    } });
}

// ====================== 商品 ======================
function viewProducts() {
  const s = UI.pSearch.trim().toLowerCase();
  const list = D.products.filter(p => (UI.showArchived || !p.archived) && (!UI.pCat || p.category_id === UI.pCat) && (!s || p.name.toLowerCase().includes(s)));
  const items = list.map(p => {
    const c = unitCost(p), price = +p.price, gp = price - c, rate = price > 0 ? gp / price * 100 : 0, av = available(p);
    const avTxt = p.kind === 'made' ? `庫存 ${qf(av)} ${esc(p.unit)}` : av == null ? '尚未設定配方' : `目前可做 ${qf(av)} ${esc(p.unit)}`;
    const low = p.kind === 'made' && p.min_stock != null && av < +p.min_stock;
    if (UI.pView === 'grid') return `<button class="tile" data-act="prodDetail" data-id="${p.id}">${photo(p.photos)}<div class="tx"><div style="font-weight:650">${esc(p.name)}</div><div style="display:flex;justify-content:space-between;font-size:14px"><span class="${low ? 'neg' : 'mut'}">${avTxt}</span><b class="pos">${money(price)}</b></div></div></button>`;
    return `<button class="item" data-act="prodDetail" data-id="${p.id}">${photo(p.photos)}<div class="meta"><div class="name">${esc(p.name)}<span class="badge ${p.kind === 'made' ? 'g' : p.kind === 'bundle' ? 'b' : ''}">${KIND_LABEL[p.kind]}</span>${p.archived ? '<span class="badge">停用</span>' : ''}</div>
      <div class="sub">成本 ${money(c)}・<span class="pos">毛利 ${money(gp)}（${rate.toFixed(1)}%）</span></div><div class="sub ${low ? 'neg' : ''}">${avTxt}</div></div>
      <div class="right"><div class="big pos">${money(price)}</div></div></button>`;
  }).join('');
  const html = `<div class="toolbar"><input class="search" id="ps" placeholder="搜尋商品名稱" value="${esc(UI.pSearch)}">
      <div class="seg"><button class="${UI.pView === 'list' ? 'on' : ''}" data-act="pView" data-v="list">清單</button><button class="${UI.pView === 'grid' ? 'on' : ''}" data-act="pView" data-v="grid">圖片牆</button></div></div>
    <div class="chips"><button class="chip ${!UI.pCat ? 'on' : ''}" data-act="pCat" data-v="">全部</button>${cats('product').map(c => `<button class="chip ${UI.pCat === c.id ? 'on' : ''}" data-act="pCat" data-v="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    ${list.length ? `<div class="grid ${UI.pView === 'grid' ? 'tiles' : ''}">${items}</div>` : `<div class="empty">${D.products.length ? '找不到符合的商品' : '還沒有商品，按右上角「＋新增商品」開始建立'}</div>`}`;
  setTimeout(() => { const el = $('#ps'); if (el) el.oninput = () => { UI.pSearch = el.value; const pos = el.selectionStart; render(); const n = $('#ps'); n.focus(); n.setSelectionRange(pos, pos); }; });
  return { title: '商品', action: `<button class="btn sm" data-act="newProduct">${I.plus}新增商品</button>`, html };
}

function productForm(p) {
  const isNew = !p;
  p = p || { kind: 'made', unit: '份', price: 0, recipe_yield: 1, photos: [] };
  const pe = photoEditor(p.photos);
  const st = { kind: p.kind, rec: recipeOf(p.id).map(r => ({ id: r.material_id, q: r.qty })), bun: bundleOf(p.id).map(b => ({ id: b.product_id, q: b.qty })) };
  if (isNew) st.rec = [{ id: '', q: 1 }];
  const body = `
    <div class="box"><div class="lab">照片</div>${pe.html}</div>
    <div class="f"><label>商品名稱 *</label><input class="in" id="p-name" value="${esc(p.name)}" placeholder="例如：苔球、油柑汁 400ml"></div>
    <div class="fr3"><div class="f"><label>售價 *</label><input class="in" id="p-price" inputmode="decimal" value="${p.price ?? ''}"></div>
      <div class="f"><label>單位</label><input class="in" id="p-unit" list="ul3" value="${esc(p.unit)}">${unitList('ul3')}</div>
      <div class="f"><label>大分類</label><select class="in" id="p-cat">${opts(cats('product'), p.category_id, '未分類')}</select></div></div>
    <div class="f"><label>商品類型</label><div class="seg" id="p-kind" style="display:flex">
      <button type="button" data-k="made" style="flex:1">事先製作</button><button type="button" data-k="recipe" style="flex:1">賣出時扣原料</button><button type="button" data-k="bundle" style="flex:1">組合商品</button></div>
      <p class="hint" id="p-kh"></p></div>
    <div id="p-recipe" class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div class="lab" style="margin:0">配方：做這個商品要用哪些原料</div></div>
      <div class="f" style="margin:10px 0"><label>這份配方一次可以做出幾${esc(p.unit || '份')}</label><input class="in" id="p-yield" inputmode="decimal" value="${p.recipe_yield}" style="max-width:160px"></div>
      <div id="p-rl"></div><button type="button" class="btn ghost" id="p-ra">${I.plus}加入原料</button>
      <div class="sum"><span>每${esc(p.unit || '份')}成本</span><b id="p-rc">—</b></div></div>
    <div id="p-bundle" class="box"><div class="lab">組合內容：賣出一組會扣掉哪些商品</div><div id="p-bl"></div><button type="button" class="btn ghost" id="p-ba">${I.plus}加入商品</button>
      <div class="sum"><span>每組成本</span><b id="p-bc">—</b></div></div>
    <div id="p-made" class="box"><label class="check"><input type="checkbox" id="p-tb" ${p.track_batch ? 'checked' : ''}><span>記錄批次與到期日（加工食品，例如油柑汁）</span></label>
      <div class="fr" style="margin-top:12px"><div class="f" style="margin:0"><label>保存天數</label><input class="in" id="p-sl" inputmode="numeric" value="${p.shelf_life_days ?? ''}" placeholder="例如：7"></div>
      <div class="f" style="margin:0"><label>最低庫存（低於會提醒）</label><input class="in" id="p-min" inputmode="decimal" value="${p.min_stock ?? ''}"></div></div></div>
    <div class="sum tot" style="padding:4px 4px 14px"><span>毛利</span><span id="p-gp">—</span></div>
    <div class="f"><label>備註</label><textarea class="in" id="p-note">${esc(p.note || '')}</textarea></div>
    ${!isNew ? `<button class="btn ${p.archived ? 'sec' : 'danger'}" style="width:100%" id="p-arch">${p.archived ? '重新啟用這個商品' : '停用這個商品'}</button>` : ''}`;
  openModal({ title: isNew ? '新增商品' : '編輯商品', body, okText: '儲存', wide: true,
    onMount: (md, el) => {
      pe.mount();
      const matOpts = sel => `<option value="">選擇原料</option>${D.materials.filter(m => !m.archived || m.id === sel).map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}（${esc(m.unit)}）</option>`).join('')}<option value="__new">＋ 新增原料…</option>`;
      const prodOpts = sel => `<option value="">選擇商品</option>${D.products.filter(x => x.id !== p.id && x.kind !== 'bundle' && (!x.archived || x.id === sel)).map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}`;
      const calc = () => {
        const y = num(v(el, '#p-yield')) || 1;
        const rc = st.rec.reduce((s, r) => s + num(r.q) * (+(mat(r.id)?.avg_cost) || 0), 0) / y;
        const bc = st.bun.reduce((s, b) => s + num(b.q) * unitCost(prod(b.id)), 0);
        $('#p-rc', el).textContent = money(rc); $('#p-bc', el).textContent = money(bc);
        const c = st.kind === 'bundle' ? bc : rc, price = num(v(el, '#p-price'));
        $('#p-gp', el).innerHTML = price > 0 ? `${money(price - c)}（${((price - c) / price * 100).toFixed(1)}%）` : '—';
      };
      const drawRec = () => {
        $('#p-rl', el).innerHTML = st.rec.map((r, i) => `<div class="rec-it"><select class="in" data-ri="${i}">${matOpts(r.id)}</select><input class="in" inputmode="decimal" data-rq="${i}" value="${r.q}" placeholder="用量"><button type="button" class="x" data-rx="${i}">×</button></div>`).join('') || '<p class="hint">還沒有加入原料</p>';
        $$('[data-ri]', el).forEach(s => s.onchange = () => {
          const i = +s.dataset.ri;
          if (s.value === '__new') { s.value = st.rec[i].id; materialForm(null, nid => { st.rec[i].id = nid; drawRec(); }); return; }
          st.rec[i].id = s.value; calc();
        });
        $$('[data-rq]', el).forEach(s => s.oninput = () => { st.rec[+s.dataset.rq].q = s.value; calc(); });
        $$('[data-rx]', el).forEach(b => b.onclick = () => { st.rec.splice(+b.dataset.rx, 1); drawRec(); });
        calc();
      };
      const drawBun = () => {
        $('#p-bl', el).innerHTML = st.bun.map((r, i) => `<div class="rec-it"><select class="in" data-bi="${i}">${prodOpts(r.id)}</select><input class="in" inputmode="decimal" data-bq="${i}" value="${r.q}" placeholder="數量"><button type="button" class="x" data-bx="${i}">×</button></div>`).join('') || '<p class="hint">還沒有加入商品</p>';
        $$('[data-bi]', el).forEach(s => s.onchange = () => { st.bun[+s.dataset.bi].id = s.value; calc(); });
        $$('[data-bq]', el).forEach(s => s.oninput = () => { st.bun[+s.dataset.bq].q = s.value; calc(); });
        $$('[data-bx]', el).forEach(b => b.onclick = () => { st.bun.splice(+b.dataset.bx, 1); drawBun(); });
        calc();
      };
      const HINT = { made: '先做好放著賣，例如苔球、油柑汁。用「製作」記錄做了幾個，賣出時扣成品庫存。', recipe: '現場才組裝，賣出時直接依配方扣原料，例如單株卷柏。', bundle: '把幾個商品綁在一起賣，例如「松木片買五送一」= 松木片 ×6。' };
      const setKind = k => { st.kind = k; $$('#p-kind button', el).forEach(b => b.classList.toggle('on', b.dataset.k === k));
        $('#p-kh', el).textContent = HINT[k]; $('#p-recipe', el).classList.toggle('hidden', k === 'bundle'); $('#p-bundle', el).classList.toggle('hidden', k !== 'bundle'); $('#p-made', el).classList.toggle('hidden', k !== 'made'); calc(); };
      $$('#p-kind button', el).forEach(b => b.onclick = () => setKind(b.dataset.k));
      $('#p-ra', el).onclick = () => { st.rec.push({ id: '', q: 1 }); drawRec(); };
      $('#p-ba', el).onclick = () => { st.bun.push({ id: '', q: 1 }); drawBun(); };
      $('#p-yield', el).oninput = calc; $('#p-price', el).oninput = calc;
      drawRec(); drawBun(); setKind(st.kind);
      const a = $('#p-arch', el); if (a) a.onclick = () => guard(async () => { await q(sb.from('products').update({ archived: !p.archived }).eq('id', p.id)); MODALS.slice().forEach(x => x.close()); await refresh(); toast(p.archived ? '已重新啟用' : '已停用'); }, a);
    },
    onOk: async md => {
      const el = md.el, name = v(el, '#p-name').trim();
      if (!name) throw new Error('請輸入商品名稱');
      const rec = st.rec.filter(r => r.id && num(r.q) > 0), bun = st.bun.filter(b => b.id && num(b.q) > 0);
      if (st.kind === 'bundle' && !bun.length) throw new Error('組合商品至少要加入一個商品');
      if (new Set(rec.map(r => r.id)).size !== rec.length) throw new Error('配方裡有重複的原料');
      if (new Set(bun.map(r => r.id)).size !== bun.length) throw new Error('組合裡有重複的商品');
      const row = { name, price: num(v(el, '#p-price')), unit: v(el, '#p-unit').trim() || '份', category_id: v(el, '#p-cat') || null, kind: st.kind,
        recipe_yield: num(v(el, '#p-yield')) || 1, track_batch: st.kind === 'made' && $('#p-tb', el).checked,
        shelf_life_days: st.kind === 'made' && $('#p-tb', el).checked ? (parseInt(v(el, '#p-sl')) || null) : null,
        min_stock: st.kind === 'made' ? numOrNull(v(el, '#p-min')) : null, note: v(el, '#p-note').trim() || null, photos: pe.get() };
      let id = p.id;
      if (isNew) id = (await q(sb.from('products').insert(row).select().single())).id;
      else await q(sb.from('products').update(row).eq('id', id));
      await q(sb.from('recipe_items').delete().eq('product_id', id));
      await q(sb.from('bundle_items').delete().eq('bundle_id', id));
      if (st.kind !== 'bundle' && rec.length) await q(sb.from('recipe_items').insert(rec.map(r => ({ product_id: id, material_id: r.id, qty: num(r.q) }))));
      if (st.kind === 'bundle') await q(sb.from('bundle_items').insert(bun.map(b => ({ bundle_id: id, product_id: b.id, qty: num(b.q) }))));
      md.close(); await refresh(); toast('已儲存');
    } });
}

function productDetail(id) {
  const p = prod(id); if (!p) return;
  const c = unitCost(p), av = available(p);
  const bs = D.batches.filter(b => b.product_id === id && +b.qty_left > 0).sort((a, b) => a.made_on.localeCompare(b.made_on));
  const recipeRows = p.kind === 'bundle'
    ? bundleOf(id).map(b => { const x = prod(b.product_id); return `<div class="row"><span>${esc(x?.name)}</span><span>× ${qf(b.qty)}　<span class="mut">${money(unitCost(x) * b.qty)}</span></span></div>`; }).join('')
    : recipeOf(id).map(r => { const m = mat(r.material_id); return `<div class="row"><span>${esc(m?.name)}</span><span>${qf(r.qty / (p.recipe_yield || 1))} ${esc(m?.unit || '')}　<span class="mut">${money((m?.avg_cost || 0) * r.qty / (p.recipe_yield || 1))}</span></span></div>`; }).join('');
  const body = `
    ${(p.photos || []).length ? `<div class="gallery">${p.photos.map(x => `<img src="${esc(URLS.get(x) || '')}" alt="">`).join('')}</div>` : ''}
    <div class="stats" style="margin-bottom:14px">
      <div class="card stat"><div class="lbl">售價</div><div class="val">${money(p.price)}</div></div>
      <div class="card stat"><div class="lbl">成本／毛利</div><div class="val" style="font-size:22px">${money(c)} ／ ${money(p.price - c)}</div><div class="mut" style="font-size:13px;margin-top:4px">毛利率 ${p.price > 0 ? ((p.price - c) / p.price * 100).toFixed(1) : '—'}%</div></div>
      <div class="card stat"><div class="lbl">${p.kind === 'made' ? '成品庫存' : '目前可做'}</div><div class="val">${av == null ? '—' : qf(av)} <span style="font-size:16px">${esc(p.unit)}</span></div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><div class="row"><b>${p.kind === 'bundle' ? '組合內容' : '配方（每' + esc(p.unit) + '）'}</b><span class="badge ${p.kind === 'made' ? 'g' : p.kind === 'bundle' ? 'b' : ''}">${KIND_LABEL[p.kind]}</span></div>${recipeRows || '<div class="mut" style="padding:10px 0">尚未設定</div>'}</div>
    ${p.kind === 'made' ? `<div class="btn-row" style="margin-bottom:8px"><button class="btn" data-a="make">${I.pot}製作</button><button class="btn sec" data-a="loss">報損</button><button class="btn sec" data-a="count">盤點</button><button class="btn sec" data-a="out">出庫</button></div>` : ''}
    ${p.track_batch ? `<div class="sec-title"><h2>批次</h2></div><div class="card">${bs.length ? bs.map(b => { const d = b.expires_on ? daysUntil(b.expires_on) : null; return `<div class="row"><div><b>${dm(b.made_on)} 製作</b><div class="mut" style="font-size:14px">做了 ${qf(b.qty_made)}・剩 ${qf(b.qty_left)} ${esc(p.unit)}</div></div>${b.expires_on ? `<span class="badge ${d < 0 ? 'r' : d <= 3 ? 'a' : 'g'}">${dm(b.expires_on)} 到期${d < 0 ? '（已過期）' : ''}</span>` : ''}</div>`; }).join('') : '<div class="mut">目前沒有庫存批次</div>'}</div>` : ''}
    ${p.kind === 'made' ? `<div class="sec-title"><h2>異動紀錄</h2></div><div class="card" id="hist"><div class="mut">載入中…</div></div>` : ''}`;
  openModal({ title: p.name, body, wide: true, cancelText: '關閉', okText: '編輯', onOk: async md => { md.close(); productForm(p); },
    onMount: (md, el) => {
      $$('[data-a]', el).forEach(b => b.onclick = () => {
        const done = () => { md.close(); productDetail(id); };
        if (b.dataset.a === 'make') produceForm(id, done); else adjustForm({ product: p, mode: b.dataset.a, onDone: done });
      });
      const h = $('#hist', el); if (h) loadHistory({ product_id: id }, h);
    } });
}

// ====================== 製作 ======================
function produceForm(pid, onDone) {
  const made = D.products.filter(p => !p.archived && p.kind === 'made');
  if (!made.length) { toast('還沒有「事先製作」類型的商品，請先到商品新增', true); return; }
  const body = `<div class="f"><label>製作哪個商品</label><select class="in" id="m-p">${opts(made, pid || made[0].id)}</select></div>
    <div class="fr"><div class="f"><label>做了幾個</label><input class="in" id="m-q" inputmode="decimal" placeholder="0" style="font-size:22px;font-weight:700;text-align:center"></div>
    <div class="f"><label>製作日期</label>${dateField('m-d', defDate())}</div></div>
    <div class="f" id="m-ew"><label>到期日</label>${dateField('m-e', '')}</div>
    <div class="box"><div class="lab">會用掉的原料</div><div id="m-need"></div><div class="sum"><span>這批成本</span><b id="m-cost">—</b></div></div>
    <div class="f"><label>備註</label><input class="in" id="m-n"></div>`;
  openModal({ title: '製作', body, okText: '完成製作',
    onMount: (md, el) => {
      const upd = (resetExp) => {
        const p = prod(v(el, '#m-p')), qn = num(v(el, '#m-q')), y = +p.recipe_yield || 1;
        $('#m-ew', el).classList.toggle('hidden', !p.track_batch);
        if (p.track_batch && p.shelf_life_days && (resetExp || !v(el, '#m-e'))) setDate(el, '#m-e', addDays(v(el, '#m-d') || today(), p.shelf_life_days));
        const rs = recipeOf(p.id); let cost = 0;
        $('#m-need', el).innerHTML = rs.length ? rs.map(r => { const m = mat(r.material_id), need = r.qty * qn / y, have = mQty(r.material_id); cost += need * (m?.avg_cost || 0);
          return `<div class="row"><span>${esc(m?.name)}</span><span>${qf(need)} ${esc(m?.unit || '')} <span class="${have < need ? 'neg' : 'mut'}" style="font-size:14px">（庫存 ${qf(have)}${have < need ? '，不足' : ''}）</span></span></div>`; }).join('') : '<p class="hint">這個商品還沒有設定配方，製作時不會扣原料，成本會是 0</p>';
        $('#m-cost', el).textContent = qn > 0 ? `${money(cost)}（每個 ${money(cost / qn)}）` : '—';
      };
      bindDates(el);
      $('#m-p', el).onchange = () => upd(true); $('#m-q', el).oninput = () => upd(false); $('#m-d', el).onchange = () => upd(true); upd(true);
    },
    onOk: async md => {
      const el = md.el, p = prod(v(el, '#m-p')), qn = num(v(el, '#m-q'));
      if (qn <= 0) throw new Error('請輸入數量');
      const short = recipeOf(p.id).filter(r => mQty(r.material_id) < r.qty * qn / (p.recipe_yield || 1));
      if (short.length && !(await confirmBox(`${short.map(r => mat(r.material_id)?.name).join('、')} 的庫存不夠。還是要記錄嗎？（之後可以補記進貨或盤點）`, '仍然記錄'))) return;
      await q(sb.rpc('produce', { p_product: p.id, p_qty: qn, p_made_on: v(el, '#m-d') || today(), p_expires_on: p.track_batch ? (v(el, '#m-e') || null) : null, p_note: v(el, '#m-n').trim() || null }));
      md.close(); await refresh(); toast(`已記錄：${p.name} +${qf(qn)}`); onDone && onDone();
    } });
}

function purchaseForm() {
  const st = { lines: [{ id: '', q: '', u: 'base', price: '' }] };

  const sups = D.suppliers.filter(s => !s.archived);
  const body = `

      <div class="f"><label>供應商</label><select class="in" id="u-s">${opts(sups, '', '未指定')}<option value="__new">＋ 新增供應商…</option></select></div></div>

    onMount: (md, el) => {
      let pay = 'cash';
      const setPay = p => { pay = p; $$('#u-pay button', el).forEach(b => b.classList.toggle('on', b.dataset.p === p)); $('#u-ph', el).textContent = p === 'cash' ? '今天的支出會同時記一筆' : '先掛在應付帳款，付款那天才算支出'; };
      $$('#u-pay button', el).forEach(b => b.onclick = () => setPay(b.dataset.p)); setPay('cash');
      md.getPay = () => pay;
      const supSel = $('#u-s', el);
      supSel.onchange = () => {
        if (supSel.value === '__new') { supSel.value = ''; supplierForm(null, nid => { supSel.innerHTML = opts(D.suppliers.filter(s => !s.archived), nid, '未指定') + '<option value="__new">＋ 新增供應商…</option>'; setPay(sup(nid)?.default_payment || 'cash'); }); return; }
        const s = sup(supSel.value); if (s) setPay(s.default_payment);
        drawLines();
      };
      const calc = () => {
        const sub = st.lines.reduce((s, l) => s + num(l.q) * num(l.price), 0), ship = num(v(el, '#u-ship'));
        $('#u-sub', el).textContent = money(sub); $('#u-tot', el).textContent = money(sub + ship);
        st.lines.forEach((l, i) => { const a = $(`[data-amt="${i}"]`, el); if (a) a.textContent = money(num(l.q) * num(l.price)); });
      };
      const drawLines = () => {
        const sid = supSel.value;
        const ms = D.materials.filter(m => !m.archived).sort((a, b) => ((b.supplier_id === sid) - (a.supplier_id === sid)) || byName(a, b));
        $('#u-lines', el).innerHTML = st.lines.map((l, i) => {
          const m = mat(l.id);
          const unitOpt = m ? `<option value="base" ${l.u === 'base' ? 'selected' : ''}>${esc(m.unit)}</option>${m.purchase_unit ? `<option value="p" ${l.u === 'p' ? 'selected' : ''}>${esc(m.purchase_unit)}（=${qf(m.purchase_factor)}${esc(m.unit)}）</option>` : ''}` : '<option>單位</option>';
          return `<div class="line-it"><div><label class="lab">原料</label><select class="in" data-li="${i}"><option value="">選擇原料</option>${ms.map(x => `<option value="${x.id}" ${x.id === l.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="__new">＋ 新增原料…</option></select></div>
            <div><label class="lab">數量</label><input class="in" inputmode="decimal" data-lq="${i}" value="${esc(l.q)}"></div>
            <div><label class="lab">單位</label><select class="in" data-lu="${i}">${unitOpt}</select></div>
            <div><label class="lab">單價</label><input class="in" inputmode="decimal" data-lp="${i}" value="${esc(l.price)}" placeholder="${m?.last_cost != null ? '上次 ' + qf(l.u === 'p' ? m.last_cost * m.purchase_factor : m.last_cost) : ''}"><div class="hint" data-amt="${i}"></div></div>
            <button type="button" class="x" data-lx="${i}">×</button></div>`;
        }).join('');
        $$('[data-li]', el).forEach(s => s.onchange = () => {
          const i = +s.dataset.li;
          if (s.value === '__new') { s.value = st.lines[i].id; materialForm(null, nid => { st.lines[i] = { id: nid, q: st.lines[i].q, u: mat(nid)?.purchase_unit ? 'p' : 'base', price: '' }; drawLines(); }); return; }
          const m = mat(s.value); st.lines[i].id = s.value; st.lines[i].u = m?.purchase_unit ? 'p' : 'base'; drawLines();
        });
        $$('[data-lq]', el).forEach(s => s.oninput = () => { st.lines[+s.dataset.lq].q = s.value; calc(); });
        $$('[data-lp]', el).forEach(s => s.oninput = () => { st.lines[+s.dataset.lp].price = s.value; calc(); });
        $$('[data-lu]', el).forEach(s => s.onchange = () => { st.lines[+s.dataset.lu].u = s.value; drawLines(); });
        $$('[data-lx]', el).forEach(b => b.onclick = () => { st.lines.splice(+b.dataset.lx, 1); if (!st.lines.length) st.lines.push({ id: '', q: '', u: 'base', price: '' }); drawLines(); });
        calc();
      };
      $('#u-add', el).onclick = () => { st.lines.push({ id: '', q: '', u: 'base', price: '' }); drawLines(); };
      $('#u-ship', el).oninput = calc;
      pe.mount(); drawLines(); bindDates(el);
    },
    onOk: async md => {
      const el = md.el;
      const lines = st.lines.filter(l => l.id && num(l.q) > 0);
      if (!lines.length) throw new Error('請至少輸入一項原料和數量');
      if (st.lines.some(l => l.id && num(l.q) > 0 && String(l.price).trim() === '') && !(await confirmBox('有原料沒有填單價，會用 0 元計算。確定要儲存嗎？', '儲存'))) return;
      const items = lines.map(l => { const m = mat(l.id), isP = l.u === 'p' && m.purchase_unit; return { material_id: l.id, input_qty: num(l.q), input_unit: isP ? m.purchase_unit : m.unit, factor: isP ? +m.purchase_factor : 1, unit_price: num(l.price) }; });
      await q(sb.rpc('create_purchase', { p: { supplier_id: v(el, '#u-s') || null, purchased_on: v(el, '#u-d') || today(), payment_type: md.getPay(), has_invoice: $('#u-inv', el).checked,
        shipping_fee: num(v(el, '#u-ship')), note: v(el, '#u-n').trim() || null, photos: pe.get(), items } }));
      md.close(); await refresh(); toast('進貨已記錄，庫存已更新');
    } });
}

    <button class="btn" style="width:100%;min-height:60px;font-size:20px" id="c-go" ${POS.cart.length ? '' : 'disabled'}>結帳 <span id="c-tot2">${money(tot)}</span></button>
    <p class="hint" style="text-align:center">記在 ${fmtDate(POS.date || today())}・${esc(c?.name || '未指定通路')}${POS.event ? '・' + esc(evt(POS.event)?.name || '') : ''}</p>`;
  const upd = () => { const t = cartTotals().tot; $('#c-tot', el).textContent = money(t); $('#c-tot2', el).textContent = money(t); };
  $$('[data-c]', el).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, a = b.dataset.c;
    if (a === 'inc') POS.cart[i].qty++;
    else if (a === 'dec') { POS.cart[i].qty--; if (POS.cart[i].qty <= 0) POS.cart.splice(i, 1); }
    else if (a === 'clear') POS.cart = [];
    else if (a === 'pay') POS.pay = b.dataset.v;
    else if (a === 'edit') return editCartLine(i);

  [['#c-disc', 'disc'], ['#c-si', 'shipIn'], ['#c-sc', 'shipCost'], ['#c-fee', 'fee'], ['#c-invno', 'invNo'], ['#c-note', 'note']].forEach(([sel, k]) => { const i = $(sel, el); if (i) i.oninput = () => { POS[k] = i.value; upd(); }; });
  $('#c-inv', el).onchange = e => { POS.inv = e.target.checked; $('#c-invw', el).classList.toggle('hidden', !POS.inv); };

function editCartLine(i) {

function checkout(btn) {
  const { online, tot } = cartTotals();
  guard(async () => {
    await q(sb.rpc('record_sale', { p: { sold_on: POS.date || today(), channel_id: POS.channel || null, event_id: POS.event || null, payment_method: POS.pay,
      discount: num(POS.disc), has_invoice: POS.inv, invoice_no: POS.inv ? POS.invNo.trim() : '', shipping_income: online ? num(POS.shipIn) : 0,
      shipping_cost: online ? num(POS.shipCost) : 0, platform_fee: online ? num(POS.fee) : 0, ship_status: online ? 'pending' : null, note: POS.note.trim(),
      items: POS.cart.map(l => ({ product_id: l.pid, qty: l.qty, unit_price: l.price })) } }));
    Object.assign(POS, { cart: [], disc: '', inv: false, invNo: '', shipIn: '', shipCost: '', fee: '', note: '' });
    await refresh(); toast(`已記錄 ${money(tot)}`);
  }, btn);
}

// ---------- 銷售紀錄 ----------
function saleSummary(rows) {
  const r = { n: rows.length, rev: 0, net: 0, cost: 0, shipIn: 0, shipCost: 0, fee: 0, byPay: {}, byProd: {} };
  rows.forEach(x => { r.rev += +x.total; r.net += +x.subtotal - +x.discount; r.cost += +x.cost_total; r.shipIn += +x.shipping_income; r.shipCost += +x.shipping_cost; r.fee += +x.platform_fee;
    r.byPay[x.payment_method] = (r.byPay[x.payment_method] || 0) + +x.total;
    (x.sale_items || []).forEach(i => { const o = r.byProd[i.product_id] = r.byProd[i.product_id] || { q: 0, amt: 0 }; o.q += +i.qty; o.amt += i.qty * i.unit_price; }); });
  r.gp = r.net - r.cost;
  return r;
}
async function loadSalesList() {
  const key = POS.event ? 'e:' + POS.event : 'd:' + (POS.date || today());
  POS.list = { key, loading: true };
  try {
    const qq = sb.from('sales').select('*, sale_items(*)');
    const rows = await q((POS.event ? qq.eq('event_id', POS.event) : qq.eq('sold_on', POS.date || today())).order('sold_at', { ascending: false }));
    const [exps, incs, uses] = POS.event ? await Promise.all([q(sb.from('expenses').select('*').eq('event_id', POS.event).order('spent_on')),
      q(sb.from('incomes').select('*').eq('event_id', POS.event).order('received_on')),
      q(sb.from('stock_movements').select('*').eq('event_id', POS.event).order('created_at'))]) : [[], [], []];
    POS.list = { key, rows, exps, incs, uses };
  } catch (e) { POS.list = { key, rows: [], exps: [], err: errMsg(e) }; }
  if (UI.tab === 'sales' && POS.mode === 'list') render();
}
function saleRow(x, showDate) {
  const its = x.sale_items || [];
  const sum = its.slice(0, 3).map(i => `${prod(i.product_id)?.name || '?'} ×${qf(i.qty)}`).join('、') + (its.length > 3 ? ` 等 ${its.length} 項` : '');
  return `<div class="row" data-sale="${x.id}" style="cursor:pointer"><div><b>${showDate ? dm(x.sold_on) + ' ' : ''}${hm(x.sold_at)}</b> <span class="badge">${PAY[x.payment_method] || x.payment_method}</span>${x.has_invoice ? '<span class="badge b">發票</span>' : ''}${x.ship_status ? `<span class="badge ${x.ship_status === 'pending' ? 'a' : 'g'}">${SHIP[x.ship_status]}</span>` : ''}
    <div class="mut" style="font-size:14px">${esc(chn(x.channel_id)?.name || '')}${x.event_id ? '・' + esc(evt(x.event_id)?.name || '') : ''}・${esc(sum)}</div></div><b class="big">${money(x.total)}</b></div>`;
}
function salesListHtml() {
  const key = POS.event ? 'e:' + POS.event : 'd:' + (POS.date || today());
  if (!POS.list || POS.list.key !== key) { setTimeout(loadSalesList); return '<div class="empty">載入中…</div>'; }
  if (POS.list.loading) return '<div class="empty">載入中…</div>';
  if (POS.list.err) return `<div class="empty neg">${esc(POS.list.err)}</div>`;
  const rows = POS.list.rows, r = saleSummary(rows), e = POS.event ? evt(POS.event) : null;
  const booth = e ? +e.booth_fee : 0, other = (POS.list.exps || []).reduce((s, x) => s + +x.amount, 0);
  const netProfit = r.gp + r.shipIn - r.shipCost - r.fee - booth - other;
  setTimeout(() => $$('[data-sale]').forEach(el => el.onclick = () => saleDetail(rows.find(x => x.id === el.dataset.sale))));
  const prodRows = Object.entries(r.byProd).sort((a, b) => b[1].amt - a[1].amt);
  if (e) setTimeout(() => bindEventSection(e, POS.list));
  return `${e ? eventSectionHtml(e, POS.list) : ''}
    <div class="stats ${e ? 'hidden' : ''}">
      <div class="card stat"><div class="lbl">營業額</div><div class="val">${money(r.rev)}</div><div class="mut" style="font-size:13px;margin-top:4px">${r.n} 筆</div></div>
      <div class="card stat"><div class="lbl">商品成本</div><div class="val" style="color:var(--ink)">${money(r.cost)}</div></div>
      <div class="card stat"><div class="lbl">毛利</div><div class="val">${money(r.gp)}</div><div class="mut" style="font-size:13px;margin-top:4px">毛利率 ${r.net > 0 ? (r.gp / r.net * 100).toFixed(1) : '—'}%</div></div>
      ${e ? `<div class="card stat"><div class="lbl">淨利</div><div class="val" style="color:${netProfit >= 0 ? 'var(--g)' : 'var(--red)'}">${money(netProfit)}</div><div class="mut" style="font-size:13px;margin-top:4px">已扣攤位費 ${money(booth)}${other ? '、其他支出 ' + money(other) : ''}</div></div>` : ''}
    </div>
    ${rows.length ? `${e ? '<div class="sec-title"><h2>商品銷售</h2></div>' : ''}<div class="sec-title"><h2>收款方式</h2></div><div class="chips" style="flex-wrap:wrap">${Object.entries(r.byPay).map(([k, val]) => `<span class="chip">${PAY[k] || k} ${money(val)}</span>`).join('')}</div>
    <div class="sec-title"><h2>商品銷量</h2></div><div class="card">${prodRows.map(([pid, o]) => `<div class="row"><span>${esc(prod(pid)?.name || '?')}</span><span><b>${qf(o.q)}</b> <span class="mut">${esc(prod(pid)?.unit || '')}</span>　${money(o.amt)}</span></div>`).join('')}</div>
    <div class="sec-title"><h2>每一筆銷售</h2></div><div class="card">${rows.map(x => saleRow(x, !!e)).join('')}</div>` : (e ? '' : `<div class="empty" style="margin-top:12px">這天沒有銷售紀錄</div>`)}`;
}
function saleDetail(x) {

  const its = x.sale_items || [];
  const body = `<div class="card" style="margin-bottom:14px">
      <div class="row"><span class="mut">時間</span><span>${x.sold_on} ${hm(x.sold_at)}</span></div>

  openModal({ title: '銷售明細', body, cancelText: '關閉', onMount: (md, el) => {

function eventPnl(ev, d) {

// ====================== 報表 ======================
const RPT = { kind: 'month', anchor: null, data: null, key: '', tip: null };
function periodRange(kind, a) {
  const d = new Date(a + 'T00:00:00'), iso = x => `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
  if (kind === 'day') return [a, a];
  if (kind === 'week') { const s = new Date(d); s.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const e = new Date(s); e.setDate(s.getDate() + 6); return [iso(s), iso(e)]; }
  if (kind === 'month') return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];
}
function periodShift(kind, a, n) {
  const d = new Date(a + 'T00:00:00');
  if (kind === 'day') d.setDate(d.getDate() + n); else if (kind === 'week') d.setDate(d.getDate() + 7 * n);
  else if (kind === 'month') { d.setDate(1); d.setMonth(d.getMonth() + n); } else d.setFullYear(d.getFullYear() + n);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function periodLabel(kind, s, e) {
  if (kind === 'day') return fmtDate(s);
  if (kind === 'week') return `${+s.slice(5, 7)}/${+s.slice(8)} – ${+e.slice(5, 7)}/${+e.slice(8)}`;
  if (kind === 'month') return `${s.slice(0, 4)} 年 ${+s.slice(5, 7)} 月`;
  return `${s.slice(0, 4)} 年`;
}
async function fetchAll(make) {
  let out = [], from = 0;
  for (;;) { const rows = await q(make().range(from, from + 999)); out = out.concat(rows); if (rows.length < 1000) break; from += 1000; }
  return out;
}
async function loadReport(s, e) {
  const key = s + '_' + e; RPT.key = key; RPT.data = null;
  try {
    const [sales, exps, incs, purs, pays, moves] = await Promise.all([
      fetchAll(() => sb.from('sales').select('*, sale_items(*)').gte('sold_on', s).lte('sold_on', e).order('sold_on')),
      fetchAll(() => sb.from('expenses').select('*').gte('spent_on', s).lte('spent_on', e).order('spent_on')),
      fetchAll(() => sb.from('incomes').select('*').gte('received_on', s).lte('received_on', e).order('received_on')),
      fetchAll(() => sb.from('purchases').select('*').gte('purchased_on', s).lte('purchased_on', e).order('purchased_on')),
      fetchAll(() => sb.from('supplier_payments').select('*').gte('paid_on', s).lte('paid_on', e).order('paid_on')),
      fetchAll(() => sb.from('stock_movements').select('*').in('reason', ['loss', 'count', 'use']).gte('occurred_on', s).lte('occurred_on', e).order('occurred_on')),
    ]);
    if (RPT.key === key) RPT.data = { sales, exps, incs, purs, pays, moves };
  } catch (err) { if (RPT.key === key) RPT.data = { err: errMsg(err) }; }
  if (UI.tab === 'reports' && RPT.key === key) render();
}
function computeReport(d, s, e, kind) {
  const evs = D.events.filter(x => x.start_date >= s && x.start_date <= e);
  const add = (m, k, val) => { m[k] = (m[k] || 0) + val; };
  const R = { prodRev: 0, shipIn: 0, inc: 0, cogs: 0, booth: 0, use: 0, loss: 0, count: 0, ship: 0, expByCat: {}, cashIn: 0, cashOut: {}, rev: {}, cost: {}, src: {}, prods: {}, chans: {}, n: d.sales.length };
  const bk = date => kind === 'year' ? date.slice(0, 7) : date;
  d.sales.forEach(x => { const net = x.subtotal - x.discount;
    R.prodRev += net; R.shipIn += +x.shipping_income; R.cogs += +x.cost_total; R.ship += +x.shipping_cost + +x.platform_fee; R.cashIn += +x.total;
    add(R.rev, bk(x.sold_on), net + +x.shipping_income); add(R.cost, bk(x.sold_on), +x.cost_total + +x.shipping_cost + +x.platform_fee);
    const c = R.chans[x.channel_id || ''] = R.chans[x.channel_id || ''] || { rev: 0, gp: 0, n: 0 }; c.rev += +x.total; c.gp += net - x.cost_total; c.n++;
    const disc = x.subtotal > 0 ? (x.subtotal - x.discount) / x.subtotal : 1;
    (x.sale_items || []).forEach(i => { const amt = i.qty * i.unit_price * disc, p = prod(i.product_id);
      add(R.src, cat(p?.category_id)?.name || '未分類商品', amt);
      const o = R.prods[i.product_id] = R.prods[i.product_id] || { q: 0, rev: 0, gp: 0 }; o.q += +i.qty; o.rev += amt; o.gp += amt - i.qty * i.unit_cost; }); });
  if (R.shipIn) add(R.src, '運費收入', R.shipIn);
  d.incs.forEach(x => { R.inc += +x.amount; R.cashIn += +x.amount; add(R.rev, bk(x.received_on), +x.amount); add(R.src, cat(x.category_id)?.name || '其他收入', +x.amount); });
  d.exps.forEach(x => { const n = cat(x.category_id)?.name || '未分類支出'; add(R.expByCat, n, +x.amount); add(R.cashOut, '營運支出', +x.amount); add(R.cost, bk(x.spent_on), +x.amount); });
  evs.forEach(x => { R.booth += +x.booth_fee; add(R.cost, bk(x.start_date), +x.booth_fee); });
  if (R.booth) add(R.cashOut, '攤位費／場地費', R.booth);
  d.moves.forEach(m => { const c = -m.qty_change * m.unit_cost; R[m.reason === 'use' ? 'use' : m.reason === 'loss' ? 'loss' : 'count'] += c; add(R.cost, bk(m.occurred_on), c); });
  d.purs.filter(p => p.payment_type === 'cash').forEach(p => add(R.cashOut, '進貨（現付）', +p.total));

    if (i % every === 0) g += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="13" fill="#6b7570">${b.label}</text>`;

function catForm(c, kind) {
  const isNew = !c;
  openModal({ title: isNew ? '新增分類' : '編輯分類', okText: '儲存', body: `<div class="f"><label>名稱</label><input class="in" id="c-n" value="${esc(c?.name || '')}"></div>${!isNew ? '<button class="btn danger" style="width:100%" id="c-del">刪除這個分類</button><p class="hint">刪除後，原本屬於這個分類的項目會變成「未分類」</p>' : ''}`,
    onMount: (md, el) => { const d = $('#c-del', el); if (d) d.onclick = async () => { if (!(await confirmBox(`確定刪除「${c.name}」？`, '刪除'))) return; guard(async () => { await q(sb.from('categories').delete().eq('id', c.id)); md.close(); await refresh(); }); }; },
    onOk: async md => { const name = v(md.el, '#c-n').trim(); if (!name) throw new Error('請輸入名稱');
      if (isNew) await q(sb.from('categories').insert({ kind, name, sort: cats(kind).length })); else await q(sb.from('categories').update({ name }).eq('id', c.id));
      md.close(); await refresh(); } });
}

// ====================== 動作對照 ======================
const ACT = {
  newMaterial: () => materialForm(null), matDetail: d => materialDetail(d.id),
  newProduct: () => productForm(null), prodDetail: d => productDetail(d.id),
  newPurchase: () => purchaseForm(), purDetail: d => purchaseDetail(d.id),
  produce: () => produceForm(null), lossPick: () => lossPick(), stocktake: () => stocktake(),
  mView: d => { UI.mView = d.v; saveUI(); render(); }, pView: d => { UI.pView = d.v; saveUI(); render(); },
  mCat: d => { UI.mCat = d.v; render(); }, pCat: d => { UI.pCat = d.v; render(); },
  newSupplier: () => supplierForm(null), editSupplier: d => supplierForm(sup(d.id)),
  newCat: d => catForm(null, d.k), editCat: d => catForm(cat(d.id)),
  goSell: () => { POS.date = UI.day || today(); POS.mode = 'pos'; UI.tab = 'sales'; saveUI(); render(); scrollTo(0, 0); },
  goSalesList: () => { POS.date = UI.day || today(); POS.event = ''; POS.mode = 'list'; UI.tab = 'sales'; saveUI(); render(); scrollTo(0, 0); },
  posMode: d => { POS.mode = d.v; render(); },
  posCh: d => { POS.channel = d.v; const e = evt(POS.event); if (e && e.channel_id && e.channel_id !== d.v) POS.event = ''; render(); },
  posCat: d => { POS.cat = d.v; render(); },
  posDate: () => pickDate(POS.date || today(), val => { POS.date = val; render(); }),
  posToday: () => { POS.date = today(); render(); },
  newEvent: () => eventForm(null), editEvent: d => eventForm(evt(d.id)),
  newExpense: () => expenseForm(null), editExpense: d => expenseForm(DAY.expenses.find(x => x.id === d.id)),
  newIncome: () => incomeForm(null), editIncome: d => incomeForm(DAY.incomes.find(x => x.id === d.id)),
  payables: () => payables(),
  openEvent: d => { const e = evt(d.id); if (!e) return; POS.event = e.id; if (e.channel_id) POS.channel = e.channel_id; POS.mode = 'list'; UI.tab = 'sales'; saveUI(); render(); scrollTo(0, 0); },
  rptKind: d => { RPT.kind = d.v; render(); },
  rptShift: d => { RPT.anchor = periodShift(RPT.kind, RPT.anchor || today(), +d.n); render(); },
  rptNow: () => { RPT.anchor = today(); render(); },
  rptPick: () => pickDate(RPT.anchor || today(), val => { RPT.anchor = val; render(); }),
  rptCsv: () => reportCsv(),
  rptPrint: () => window.print(),
  dayShift: d => gotoDay(addDays(UI.day || today(), +d.n)),
  dayToday: () => gotoDay(today()),
  dayPick: () => pickDate(UI.day || today(), val => gotoDay(val)),
  reload: (d, el) => guard(async () => { URLS.clear(); await refresh(); toast('已更新'); }, el),
  logout: async () => { if (await confirmBox('確定要登出嗎？', '登出')) { await sb.auth.signOut(); } },
};

// ====================== 啟動 ======================
async function start(session) {
  USER = session?.user || null;
  if (!USER) { render(); return; }
  $('#app').innerHTML = '<div class="loading">載入資料中…</div>';
  try { await loadAll(); await ensureDefaults(); render(); }
  catch (e) { console.error(e); $('#app').innerHTML = `<div class="loading"><p class="neg">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">重新載入</button></div>`; }
}
let started = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') { USER = null; MODALS.slice().forEach(m => m.close()); render(); return; }
  if (ev === 'INITIAL_SESSION' || (ev === 'SIGNED_IN' && (!USER || USER.id !== session?.user?.id))) { started = true; setTimeout(() => start(session)); }
});
setTimeout(() => { if (!started) sb.auth.getSession().then(({ data }) => start(data.session)); }, 1500);
</script>
